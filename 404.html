<!DOCTYPE html>
<html lang="en-SG" data-theme="sepia">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Guneet Kaur Julka</title>
<meta name="robots" content="noindex">
<script>
  try { var t = localStorage.getItem('theme'); if (t === 'light') delete document.documentElement.dataset.theme; else if (t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  .nf h1 { font-size: 40px; margin: 16px 0 8px; }
  .nf p { color: var(--text-2); margin-bottom: 24px; }
</style>
</head>
<body>
  <main class="nf">
    <div>
      <span class="mono mono-lg" aria-hidden="true">GK</span>
      <h1>Page not found</h1>
      <p>The page you are looking for doesn't exist.</p>
      <a class="btn btn-primary" href="/">Back to the homepage</a>
    </div>
  </main>
</body>
</html>
